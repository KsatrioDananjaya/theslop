<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>GG EZ — Brag</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Rajdhani";
        font-style: normal;
        font-weight: 500;
        src: url("assets/fonts/rajdhani-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "Rajdhani";
        font-style: normal;
        font-weight: 600;
        src: url("assets/fonts/rajdhani-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Rajdhani";
        font-style: normal;
        font-weight: 700;
        src: url("assets/fonts/rajdhani-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-weight: 200 800;
        src: url("assets/fonts/manrope-variable.woff2") format("woff2");
      }

      :root {
        --bg: #0a0a0f;
        --bg-elevated: #131319;
        --bg-elevated-2: #191922;
        --border: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.18);
        --text: #f5f5fa;
        --text-dim: #a3a3b5;
        --accent: #ff2f76;
        --accent-soft: rgba(255, 47, 118, 0.16);
        --accent-border: rgba(255, 47, 118, 0.45);
        --accent-2: #2fe4ff;
        --positive: #3ee08a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Manrope", sans-serif;
        color: var(--text);
      }

      /* ---------- persistent background ---------- */
      #bg {
        position: absolute;
        inset: 0;
      }
      #bg-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(var(--border) 1.5px, transparent 1.5px),
          linear-gradient(90deg, var(--border) 1.5px, transparent 1.5px);
        background-size: 96px 96px;
        opacity: 0.4;
      }
      #bg-glow-a {
        position: absolute;
        width: 1400px;
        height: 1400px;
        left: -300px;
        top: -400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 47, 118, 0.32) 0%, transparent 68%);
        filter: blur(30px);
      }
      #bg-glow-b {
        position: absolute;
        width: 1300px;
        height: 1300px;
        right: -350px;
        bottom: -500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(47, 228, 255, 0.22) 0%, transparent 68%);
        filter: blur(30px);
      }

      /* ---------- scenes ---------- */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .display-text {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.005em;
        text-align: center;
        line-height: 1.02;
        color: var(--text);
      }

      .hook-line {
        font-size: 148px;
        max-width: 1600px;
        will-change: transform, opacity;
      }

      .feature-line {
        font-size: 128px;
        max-width: 1700px;
        will-change: transform, opacity;
      }

      /* ---------- squad card scene ---------- */
      #squad-card {
        width: 1180px;
        background: var(--bg-elevated);
        border: 2px solid var(--border-strong);
        border-radius: 32px;
        padding: 48px 56px;
        box-shadow: 0 60px 140px -40px rgba(0, 0, 0, 0.7);
      }
      .squad-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 36px;
      }
      .squad-label {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .live-pill {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 12px 24px;
        border-radius: 999px;
        background: rgba(62, 224, 138, 0.14);
        color: var(--positive);
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .live-dot {
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--positive);
      }
      .roster {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .roster-row {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 20px 26px;
        border-radius: 20px;
        background: var(--bg-elevated-2);
        border: 2px solid var(--border);
        opacity: 0;
        will-change: transform, opacity;
      }
      .roster-row.is-you {
        border-color: var(--accent-border);
        background: var(--accent-soft);
      }
      .row-avatar {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 26px;
        color: var(--bg);
      }
      .row-avatar.is-accent {
        background: var(--accent);
      }
      .row-avatar.is-neutral {
        background: var(--bg-elevated);
        color: var(--accent);
      }
      .row-name {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 32px;
      }
      .row-role {
        font-size: 22px;
        color: var(--text-dim);
        margin-top: 2px;
      }
      .row-rank {
        margin-left: auto;
        font-family: "Rajdhani", sans-serif;
        font-weight: 600;
        font-size: 26px;
        color: var(--text-dim);
      }

      /* ---------- stat scene ---------- */
      .stat-row {
        display: flex;
        gap: 100px;
      }
      .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        opacity: 0;
        will-change: transform, opacity;
      }
      .stat-value {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 108px;
        letter-spacing: -0.01em;
        color: var(--text);
      }
      .stat-label {
        font-family: "Rajdhani", sans-serif;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }

      /* ---------- outro scene ---------- */
      #outro-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      #logo-text {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 260px;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        line-height: 1;
        opacity: 0;
        will-change: transform, opacity;
      }
      #outro-tagline {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 52px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="19.99"
    >
      <!-- persistent background, whole duration -->
      <div id="bg" class="clip" data-start="0" data-duration="19.99" data-track-index="0">
        <div id="bg-grid"></div>
        <div id="bg-glow-a"></div>
        <div id="bg-glow-b"></div>
      </div>

      <!-- Scene 1: hook line 1 -->
      <section id="scene-hook1" class="clip scene" data-start="0" data-duration="2.60" data-track-index="1">
        <h1 id="hook1-text" class="display-text hook-line">Your Aim Is Fine.</h1>
      </section>

      <!-- Scene 2: hook payoff -->
      <section id="scene-hook2" class="clip scene" data-start="2.60" data-duration="1.88" data-track-index="1">
        <h1 id="hook2-text" class="display-text hook-line">Your Team Wasn't.</h1>
      </section>

      <!-- Scene 3: Squad Finder reveal -->
      <section id="scene-squad" class="clip scene" data-start="4.48" data-duration="4.45" data-track-index="1">
        <div id="squad-card">
          <div class="squad-card-top">
            <span class="squad-label">Squad Finder</span>
            <span class="live-pill"><span class="live-dot"></span>Matching Now</span>
          </div>
          <div class="roster">
            <div class="roster-row is-you" id="row-you">
              <span class="row-avatar is-accent">YOU</span>
              <div>
                <div class="row-name">You</div>
                <div class="row-role">Duelist</div>
              </div>
              <span class="row-rank">Diamond II</span>
            </div>
            <div class="roster-row" id="row-zeal">
              <span class="row-avatar is-neutral">ZE</span>
              <div>
                <div class="row-name">Zeal</div>
                <div class="row-role">In-Game Lead</div>
              </div>
              <span class="row-rank">Diamond III</span>
            </div>
            <div class="roster-row" id="row-akari">
              <span class="row-avatar is-neutral">AK</span>
              <div>
                <div class="row-name">Akari</div>
                <div class="row-role">Sentinel</div>
              </div>
              <span class="row-rank">Platinum I</span>
            </div>
            <div class="roster-row" id="row-sy">
              <span class="row-avatar is-neutral">SY</span>
              <div>
                <div class="row-name">Sy</div>
                <div class="row-role">Flex</div>
              </div>
              <span class="row-rank">Diamond I</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Scene 4: stat burst -->
      <section id="scene-stats" class="clip scene" data-start="8.93" data-duration="2.34" data-track-index="1">
        <div class="stat-row">
          <div class="stat-item" id="stat-1">
            <span class="stat-value">14,200+</span>
            <span class="stat-label">Squads</span>
          </div>
          <div class="stat-item" id="stat-2">
            <span class="stat-value">1m 52s</span>
            <span class="stat-label">Avg Match</span>
          </div>
          <div class="stat-item" id="stat-3">
            <span class="stat-value">4.6 / 5</span>
            <span class="stat-label">Rating</span>
          </div>
        </div>
      </section>

      <!-- Scene 5: feature claim 1 -->
      <section id="scene-feat1" class="clip scene" data-start="11.27" data-duration="1.87" data-track-index="1">
        <h1 id="feat1-text" class="display-text feature-line">Mic-On Lobbies</h1>
      </section>

      <!-- Scene 6: feature claim 2 -->
      <section id="scene-feat2" class="clip scene" data-start="13.14" data-duration="1.88" data-track-index="1">
        <h1 id="feat2-text" class="display-text feature-line">Griefers Get Filtered</h1>
      </section>

      <!-- Scene 7: outro -->
      <section id="scene-outro" class="clip scene" data-start="15.02" data-duration="4.97" data-track-index="1">
        <div id="outro-wrap">
          <h1 id="logo-text">GG EZ</h1>
          <p id="outro-tagline">Find Your Squad</p>
        </div>
      </section>

      <!-- ================= AUDIO ================= -->

      <!-- music bed: full track, flat at 0.4, quick fade in the last 0.3s -->
      <audio
        id="music"
        src="assets/music/brag-track.mp3"
        data-start="0"
        data-duration="19.99"
        data-track-index="10"
        data-volume="0.4"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.4},{"t":19.69,"v":0.4},{"t":19.99,"v":0}]}]}'
      ></audio>

      <!-- SFX: one hit per beat-locked reveal -->
      <audio id="sfx-hook1" src="assets/sfx/impact/impactSoft_heavy_001.ogg" data-start="0" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-hook2" src="assets/sfx/impact/impactSoft_heavy_002.ogg" data-start="2.60" data-track-index="12" data-volume="0.82"></audio>

      <audio id="sfx-row-you" src="assets/sfx/casino/card-place-1.ogg" data-start="4.48" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-row-zeal" src="assets/sfx/casino/card-place-2.ogg" data-start="4.96" data-track-index="14" data-volume="0.68"></audio>
      <audio id="sfx-row-akari" src="assets/sfx/casino/card-place-3.ogg" data-start="5.89" data-track-index="15" data-volume="0.68"></audio>
      <audio id="sfx-row-sy" src="assets/sfx/casino/card-place-4.ogg" data-start="6.72" data-track-index="16" data-volume="0.68"></audio>

      <audio id="sfx-stat-1" src="assets/sfx/impact/impactSoft_medium_000.ogg" data-start="8.93" data-track-index="17" data-volume="0.65"></audio>
      <audio id="sfx-stat-2" src="assets/sfx/impact/impactSoft_medium_001.ogg" data-start="9.87" data-track-index="18" data-volume="0.65"></audio>
      <audio id="sfx-stat-3" src="assets/sfx/impact/impactSoft_medium_002.ogg" data-start="10.80" data-track-index="19" data-volume="0.65"></audio>

      <audio id="sfx-feat1" src="assets/sfx/impact/impactSoft_medium_003.ogg" data-start="11.27" data-track-index="20" data-volume="0.7"></audio>
      <audio id="sfx-feat2" src="assets/sfx/impact/impactSoft_medium_004.ogg" data-start="13.14" data-track-index="21" data-volume="0.7"></audio>

      <audio id="sfx-logo" src="assets/sfx/impact/impactBell_heavy_003.ogg" data-start="15.49" data-track-index="22" data-volume="0.95"></audio>
      <audio id="sfx-tagline" src="assets/sfx/interface/drop_001.ogg" data-start="16.18" data-track-index="23" data-volume="0.6"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------------- background: subtle beat-synced glow breathing ----------------
      // Approximated audio-reactive treatment: nudge glow opacity/scale on the
      // strongest beats from the analyzed beat grid (assets/music/cues/brag-track.music-cues.json),
      // instead of continuous per-frame RMS extraction. Subtle, never a waveform/EQ visual.
      const glowBeats = [1.2, 2.6, 4.48, 5.89, 7.99, 8.93, 9.87, 11.74, 13.14, 15.49, 16.18];
      glowBeats.forEach((t) => {
        tl.to("#bg-glow-a, #bg-glow-b", { scale: 1.045, duration: 0.11, ease: "power2.out" }, t);
        tl.to("#bg-glow-a, #bg-glow-b", { scale: 1, duration: 0.32, ease: "power2.inOut" }, t + 0.11);
      });
      gsap.set("#bg-glow-a, #bg-glow-b", { transformOrigin: "50% 50%" });

      // ---------------- Scene 1: hook line 1 — slam in, cold open ----------------
      // beat-locked: 0.00s (cold open, matches audio start)
      tl.fromTo(
        "#hook1-text",
        { opacity: 0, scale: 1.28 },
        { opacity: 1, scale: 1, duration: 0.32, ease: "power4.out" },
        0
      );

      // ---------------- Scene 2: hook payoff — hard cut + slam ----------------
      // beat-locked: 2.60s (beat grid)
      tl.fromTo(
        "#hook2-text",
        { opacity: 0, scale: 1.3 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" },
        2.6
      );

      // ---------------- Scene 3: Squad Finder — card in, rows sequential ----------------
      // beat-locked: 4.48s (beat grid) for the card; rows every-other-beat: 4.96 / 5.89 / 6.72 / 7.56
      tl.fromTo(
        "#squad-card",
        { opacity: 0, y: 40, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
        4.48
      );
      const rows = [
        { id: "#row-you", t: 4.48 },
        { id: "#row-zeal", t: 4.96 },
        { id: "#row-akari", t: 5.89 },
        { id: "#row-sy", t: 6.72 },
      ];
      rows.forEach((row) => {
        tl.fromTo(
          row.id,
          { opacity: 0, x: -36 },
          { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" },
          row.t
        );
      });

      // ---------------- Scene 4: stat burst — rapid-fire ----------------
      // beat-locked: 8.93 / 9.87 / 10.80 (beat grid)
      const stats = [
        { id: "#stat-1", t: 8.93 },
        { id: "#stat-2", t: 9.87 },
        { id: "#stat-3", t: 10.8 },
      ];
      stats.forEach((stat) => {
        tl.fromTo(
          stat.id,
          { opacity: 0, y: 30, scale: 0.85 },
          { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.2)" },
          stat.t
        );
      });

      // ---------------- Scene 5: feature claim 1 ----------------
      // beat-locked: 11.27s (scene start, near strong_beat 11.74s)
      tl.fromTo(
        "#feat1-text",
        { opacity: 0, scale: 1.2 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" },
        11.27
      );

      // ---------------- Scene 6: feature claim 2 ----------------
      // beat-locked: 13.14s (strong_beat cue)
      tl.fromTo(
        "#feat2-text",
        { opacity: 0, scale: 1.2 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" },
        13.14
      );

      // ---------------- Scene 7: outro — logo slam, tagline settle ----------------
      // beat-locked: logo at 15.49s (strong_beat), tagline at 16.18s (onset_peak)
      tl.fromTo(
        "#logo-text",
        { opacity: 0, scale: 1.5 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power4.out" },
        15.49
      );
      tl.fromTo(
        "#outro-tagline",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        16.18
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
